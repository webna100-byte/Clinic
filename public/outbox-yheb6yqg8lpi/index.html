<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bytevia Outbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--navy:#0B1F3A;--teal:#14B8A6;--mint:#E6F4F1;--bg:#f4f7f8;--card:#fff;--ink:#14202e;--muted:#66768a;--line:#e1e8ec;--wa:#25D366;--ig:#c13584;--warn:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.02em}header b i{color:var(--teal);font-style:normal}
.stats{margin-inline-start:auto;display:flex;gap:14px;font-size:13px;color:#cfe7e3;flex-wrap:wrap}.stats span b{color:#fff}
.app{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
aside{background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tab{padding:13px 8px;background:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab.on[data-t=wa]{color:#128c4a;border-color:var(--wa)}.tab.on[data-t=ig]{color:var(--ig);border-color:var(--ig)}
.tab small{display:block;font-weight:400;font-size:12px}
.tools{padding:10px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.tools input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
.tools select{border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:#fff}
#list{overflow:auto;flex:1}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:none;padding:11px 14px;border-bottom:1px solid var(--line)}
.it:hover{background:#f6fafa}.it.sel{background:var(--mint)}
.dot{width:10px;height:10px;border-radius:50%;background:#cbd5db;flex:none}
.it.sent .dot{background:var(--teal)}.it.due .dot{background:var(--warn)}.it.blk{opacity:.45}
.it .n{flex:1;min-width:0}.it .n b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .n span{font-size:12px;color:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef2f4;color:var(--muted);white-space:nowrap}
.tag.s3{background:#e2f6ef;color:#0b7a55}.tag.weak{background:#fdf0dd;color:#a15d05}
main{overflow:auto;padding:22px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:760px;margin:0 auto}
.back{display:none;background:none;color:var(--muted);margin-bottom:10px;padding:0}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12.5px;padding:4px 12px;border-radius:999px;background:#eef2f4}
.chip.warn{background:#fdf0dd;color:#a15d05}.chip.good{background:#e2f6ef;color:#0b7a55}
label{font-size:13px;color:var(--muted);display:block;margin:12px 0 6px}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;line-height:1.7;resize:vertical;background:#fcfdfd}
textarea:focus{outline:2px solid color-mix(in srgb,var(--teal) 40%,transparent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.big{flex:1 1 260px;padding:16px 20px;border-radius:14px;color:#fff;font-weight:700;font-size:17px}
.big.wa{background:var(--wa)}.big.ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
.big:disabled{opacity:.4;cursor:not-allowed}
.sec{padding:14px 18px;border-radius:14px;background:#eef2f4;color:var(--ink);font-weight:600}
.sec.done{background:var(--teal);color:#fff}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.mini button,.mini a{background:#eef2f4;border-radius:10px;padding:8px 14px;font-size:13px;color:var(--ink);text-decoration:none}
.note{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.7}.note b{color:var(--ink)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border:0}main{display:none;padding:12px}.show-detail aside{display:none}.show-detail main{display:block}.back{display:block}.card{padding:16px}}
</style>
</head>

</div>

var KEY='bv_outbox_v1';
var S={tab:'wa',sel:null,q:'',flt:'pending',st:{},edit:{}};
try{S.st=JSON.parse(localStorage.getItem(KEY)||'{}');S.edit=JSON.parse(localStorage.getItem(KEY+'_e')||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S.st));localStorage.setItem(KEY+'_e',JSON.stringify(S.edit))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function days(ts){return (Date.now()-ts)/86400000}
function state(d){var s=S.st[d.id];if(!s)return 'new';if(s.f)return 'sent2';if(days(s.t)>=3)return 'due';return 'sent'}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1800)}
function copy(text){
  function fb(){var a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a)}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).catch(fb)}}catch(e){}
  fb();return Promise.resolve();
}
function igUrl(d){return d.ig||''}
function msgOf(d){return S.edit[d.id]!=null?S.edit[d.id]:d.msg1}
function visible(){
  var q=S.q.trim().toLowerCase();
  return DATA.filter(function(d){
    if(d.ch!==S.tab)return false;
    var st=state(d);
    if(S.flt==='pending'&&st!=='new')return false;
    if(S.flt==='sent'&&st==='new')return false;
    if(S.flt==='due'&&st!=='due')return false;
    if(q&&(d.name+' '+d.city+' '+d.country+' '+d.sub).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function counts(ch){var t=0,s=0,du=0;DATA.forEach(function(d){if(d.ch!==ch)return;t++;var x=state(d);if(x!=='new')s++;if(x==='due')du++});return{t:t,s:s,du:du}}
function renderTabs(){
  var w=counts('wa'),i=counts('ig');
  $('tab-wa').innerHTML='واتساب<small>'+w.s+' / '+w.t+' مُرسل</small>';
  $('tab-ig').innerHTML='انستغرام<small>'+i.s+' / '+i.t+' مُرسل</small>';
  [].forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('on',b.dataset.t===S.tab)});
  var due=w.du+i.du;
  $('stats').innerHTML='<span>اليوم: <b>'+todayCount()+'</b></span><span>مُرسل: <b>'+(w.s+i.s)+'</b></span><span>متابعات مستحقة: <b>'+due+'</b></span>';
}
function todayCount(){var n=0,t0=new Date();t0.setHours(0,0,0,0);Object.keys(S.st).forEach(function(k){if(S.st[k].t>=t0.getTime())n++});return n}
function renderList(){
  var v=visible();
  $('list').innerHTML=v.length?v.map(function(d){
    var st=state(d),cls='it '+(st==='new'?'':st==='due'?'due':'sent')+(d.blocked?' blk':'')+(S.sel===d.id?' sel':'');
    var tag=d.act==='ضعيف النشاط'?'<span class="tag weak">ضعيف النشاط</span>':(d.score==='3'?'<span class="tag s3">حاجة قوية</span>':'');
    return '<button class="'+cls+'" data-id="'+d.id+'"><i class="dot"></i><span class="n"><b>'+esc(d.name)+'</b><span>'+esc(d.city)+' · '+esc(d.country)+'</span></span>'+tag+'</button>';
  }).join(''):'<div class="empty">لا توجد نتائج في هذه القائمة</div>';
}
function renderDetail(){
  var d=DATA.filter(function(x){return x.id===S.sel})[0],el=$('detail');
  if(!d){el.innerHTML='<div class="card empty">اختر نشاطًا من القائمة</div>';return}
  var st=state(d),sent=S.st[d.id],isWa=d.ch==='wa';
  var chips='<span class="chip">'+esc(d.niche)+(d.sub?' · '+esc(d.sub):'')+'</span><span class="chip">'+esc(d.city)+' · '+esc(d.country)+'</span>';
  if(d.score==='3')chips+='<span class="chip good">حاجة قوية</span>';
  if(d.act==='ضعيف النشاط')chips+='<span class="chip warn">ضعيف النشاط</span>';
  if(d.hint)chips+='<span class="chip">'+esc(d.hint)+'</span>';
  if(d.review)chips+='<span class="chip warn">يحتاج مراجعة لغوية</span>';
  if(sent)chips+='<span class="chip good">أُرسلت '+new Date(sent.t).toLocaleDateString('ar')+(st==='due'?' · وقت المتابعة':'')+'</span>';
  var msg=(sent&&sent.f===undefined&&st==='due')?d.msg2:msgOf(d);
  var lab=(st==='due')?'رسالة المتابعة (بعد 3 أيام)':'الرسالة (يمكنك تعديلها)';
  var primary;
  if(d.blocked)primary='<button class="big" disabled>لا تُرسل: الحساب غير متاح</button>';
  else if(isWa)primary='<button class="big wa" id="go">فتح واتساب بالرسالة</button>';
  else primary='<button class="big ig" id="go">نسخ الرسالة وفتح انستغرام</button>';
  el.innerHTML='<div class="card"><button class="back" id="back">← القائمة</button><h1>'+esc(d.name)+'</h1><div class="sub">'+(isWa?'<span dir="ltr">+'+esc(d.wa)+'</span>':'<span dir="ltr">'+esc(d.ig.replace('https://www.instagram.com/','@').replace(/\/$/,''))+'</span>')+'</div><div class="chips">'+chips+'</div>'+
   '<label for="msg">'+lab+'</label><textarea id="msg">'+esc(msg)+'</textarea>'+
   '<div class="actions">'+primary+'<button class="sec'+(sent?' done':'')+'" id="done">'+(sent?'✓ تم، التالي':'تم الإرسال ✓')+'</button></div>'+
   '<div class="mini"><button id="cp">نسخ الرسالة فقط</button>'+(d.ig?'<a href="'+esc(d.ig)+'" target="_blank" rel="noopener">فتح الحساب</a>':'')+(d.demo?'<button id="cd">نسخ رابط الديمو</button>':'')+(d.maps?'<a href="'+esc(d.maps)+'" target="_blank" rel="noopener">الخريطة</a>':'')+'<button id="r3">ردّ: أرسل الديمو</button><button id="skip">تخطي</button><button id="upto">علّم هذا وكل ما قبله كمُرسل</button></div>'+
   '<div class="note">'+(isWa?'<b>واتساب:</b> الزر يفتح المحادثة والرسالة جاهزة، اضغط إرسال داخل واتساب ثم ارجع واضغط "تم الإرسال".':'<b>انستغرام:</b> الزر ينسخ الرسالة ويفتح الحساب، اضغط Message ثم الصق (لصق) وأرسل، ثم ارجع واضغط "تم الإرسال".')+(d.note?'<br><b>ملاحظات:</b> '+esc(d.note):'')+(d.reason?'<br><b>سبب الحاجة:</b> '+esc(d.reason):'')+'</div></div>';
  var ta=$('msg');
  ta.addEventListener('input',function(){S.edit[d.id]=ta.value;save()});
  if($('back'))$('back').onclick=function(){$('app').classList.remove('show-detail')};
  $('cp').onclick=function(){copy(ta.value).then(function(){toast('تم نسخ الرسالة')})};
  if($('cd'))$('cd').onclick=function(){copy(d.demo).then(function(){toast('تم نسخ رابط الديمو')})};
  $('r3').onclick=function(){
    var t=d.msg3;
    if(isWa){window.open('https://wa.me/'+d.wa+'?text='+encodeURIComponent(t),'_blank','noopener')}
    else{copy(t).then(function(){toast('تم نسخ رسالة الديمو، الصقها في المحادثة')});window.open(igUrl(d),'_blank','noopener')}
  };
  $('skip').onclick=function(){next(d.id)};
  $('upto').onclick=function(){
    var list=DATA.filter(function(x){return x.ch===d.ch}),pos=list.map(function(x){return x.id}).indexOf(d.id)+1;
    if(!confirm('تعليم '+pos+' جهة (من الأولى حتى هذه) كمُرسلة؟'))return;
    var n=0;list.slice(0,pos).forEach(function(x){if(!x.blocked&&!S.st[x.id]){S.st[x.id]={t:Date.now()};n++}});
    save();toast('تم تعليم '+n+' جهة كمُرسلة');renderAll();
  };
  $('done').onclick=function(){
    if(!S.st[d.id]){S.st[d.id]={t:Date.now()}}else if(st==='due'){S.st[d.id].f=Date.now()}
    save();toast('تم تسجيل الإرسال');next(d.id,true);
  };
  if($('go')&&!d.blocked)$('go').onclick=function(){
    var text=ta.value;
    if(isWa){window.open('https://wa.me/'+d.wa+'?text='+encodeURIComponent(text),'_blank','noopener')}
    else{copy(text).then(function(){toast('تم نسخ الرسالة، الصقها في المحادثة')});window.open(igUrl(d),'_blank','noopener')}
  };
}
function next(id,keep){
  var v=visible(),i=v.map(function(x){return x.id}).indexOf(id);
  var n=v[i+1]||v[i-1];
  if(keep&&!n){S.sel=null}else if(n){S.sel=n.id}
  renderAll();
  if(!n){$('app').classList.remove('show-detail')}
}
function renderAll(){renderTabs();renderList();renderDetail()}
document.addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(t){S.tab=t.dataset.t;var f0=visible()[0];S.sel=f0?f0.id:null;renderAll();return}
  var it=e.target.closest('.it');if(it){S.sel=+it.dataset.id;renderAll();$('app').classList.add('show-detail');$('list').scrollTop=$('list').scrollTop}
});
$('q').addEventListener('input',function(){S.q=this.value;renderList()});
$('flt').addEventListener('change',function(){S.flt=this.value;var f0=visible()[0];S.sel=f0?f0.id:null;renderAll()});
var first=visible()[0];if(first)S.sel=first.id;
renderAll();
</script>
